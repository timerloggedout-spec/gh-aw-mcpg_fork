name: Build Smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Go mod download
        run: go mod download
      - name: Build
        run: |
          if [ -f Makefile ]; then
            make build || go build -o awmg .
          else
            go build -o awmg .
          fi
      - name: Binary exists
        run: test -x ./awmg || test -f ./awmg
